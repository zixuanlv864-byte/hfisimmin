    <script>
      (() => {
        const stateKey = "swimmin_local_state_v1";
        const guideKey = "swimmin_onboarding_done_v1";
        try {
          const saved = JSON.parse(localStorage.getItem(stateKey) || "null");
          const isOldDemo = saved?.version === 1
            && saved.journeyKm === 18.7
            && saved.totalMinutes === 324
            && saved.totalCalories === 5120
            && saved.entries?.length === 3
            && saved.entries.every((entry) => ["r-0804", "r-0801", "r-0729"].includes(entry.id));
          if (isOldDemo) {
            localStorage.removeItem(stateKey);
            localStorage.removeItem(guideKey);
          }
        } catch {
          localStorage.removeItem(stateKey);
          localStorage.removeItem(guideKey);
        }
      })();

/* Responsive polish: preserve card proportions and compact horizontal groups. */
html,body,#root{max-width:100%;overflow-x:hidden}
button,input,select,textarea{max-width:100%}
.profile-hero>*{min-width:0}
.profile-pool .pixel-person{transform-origin:center}
.profile-tags{min-width:0;scrollbar-width:none}
.profile-tags::-webkit-scrollbar{display:none}
@media (max-width:700px){
  .shell{padding-inline:max(10px,env(safe-area-inset-left));padding-bottom:calc(92px + env(safe-area-inset-bottom))}
  .topbar{height:64px;gap:8px}.top-actions{gap:5px}
  .content-page{width:100%;margin-top:8px}
  .profile-hero{grid-template-columns:minmax(92px,32vw) minmax(0,1fr);gap:12px;padding:12px}
  .profile-pool{width:100%;height:auto;min-height:118px;aspect-ratio:1/1.12}
  .profile-pool .pixel-person{transform:scale(.82)}
  .profile-hero h1{font-size:clamp(20px,7vw,28px);overflow-wrap:anywhere}
  .profile-hero p{font-size:9px;overflow-wrap:anywhere}
  .profile-tags{display:flex;flex-wrap:nowrap;gap:6px;width:100%;margin-top:10px;overflow-x:auto;overscroll-behavior-inline:contain;scroll-snap-type:x proximity}
  .profile-tags span{flex:0 0 auto;white-space:nowrap;padding:7px 9px;font-size:9px;scroll-snap-align:start}
  .profile-hero .edit-avatar-button{grid-column:1/-1;width:100%}
  .summary-grid,.summary-grid.five{grid-template-columns:repeat(2,minmax(0,1fr))}
  .summary-grid>*{min-width:0}
  .reward-shelf{gap:12px;padding:14px}
  .reward-icons{display:flex;flex-wrap:nowrap;width:100%;padding:2px 2px 8px;overflow-x:auto}
  .reward-icons>span{flex:0 0 66px}
  .route-grid,.atlas-grid{grid-template-columns:1fr}
  .route-card,.record-list,.avatar-editor,.friends-intro{min-width:0}
  .record-row{gap:8px}.record-row>*{min-width:0}
  .record-row strong,.record-row p{overflow-wrap:anywhere}
  .board-row,.board-row.detailed{gap:7px}
  .friend-progress-info,.distance-award{min-width:0}
  .distance-award{white-space:nowrap}
  .modal-backdrop{padding:0}
  .modal,.manual-plan-modal,.friend-manager-modal,.local-storage-modal{width:100%;max-height:100dvh;border-radius:0}
  .onboarding-modal{overscroll-behavior:contain}.onboarding-welcome{min-height:0}
  .onboarding-copy h1,.onboarding-body h2{overflow-wrap:anywhere}
  .history-record-head{grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) auto}
}
@media (max-width:380px){
  .profile-hero{grid-template-columns:86px minmax(0,1fr);gap:9px;padding:10px}
  .profile-pool{min-height:104px}.profile-pool .pixel-person{transform:scale(.72)}
  .profile-tags span{font-size:8px}.summary-grid,.summary-grid.five{gap:7px}
  .onboarding-goals{grid-template-columns:1fr}
  .onboarding-goals button{display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:center}
  .onboarding-goals button small{grid-column:2}
}


/* Keep the full swimmer inside the profile card and preserve the social order. */
.profile-pool{overflow:visible!important;isolation:isolate}
.profile-pool .mode-full{transform:scale(.76);transform-origin:50% 50%}
.friends-social-grid{display:grid}
.friends-social-grid>.swim-moment-card{order:2}
.friends-social-grid>.ranking-summary-card{order:1}
.onboarding-name-field{display:block;margin:16px 0 0}
.onboarding-name-field span{color:#4b8f94;margin-bottom:6px;font-size:9px;font-weight:950;display:block}
.onboarding-name-field input{color:#274f58;background:#fff;border:2px solid #dcebea;border-radius:12px;outline:0;width:100%;height:43px;padding:0 12px;font-size:11px;font-weight:800;box-sizing:border-box}
.onboarding-name-field input:focus{border-color:var(--coral);box-shadow:0 0 0 3px #ff806d1f}
@media (max-width:700px){
  .profile-pool{min-height:138px;overflow:visible!important}
  .profile-pool .mode-full{transform:scale(.45);transform-origin:50% 50%}
  .onboarding-name-field{margin-top:12px}
  .onboarding-name-field input{height:40px}
}
